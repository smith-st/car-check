    <g class="wheel"><circle cx="84" cy="106" r="18" fill="#0f1114" stroke="#8b95a3" stroke-width="3"/><path d="M84 92v28M70 106h28" stroke="#ffb020" stroke-width="3"/></g>
    <g class="wheel"><circle cx="236" cy="106" r="18" fill="#0f1114" stroke="#8b95a3" stroke-width="3"/><path d="M236 92v28M222 106h28" stroke="#ffb020" stroke-width="3"/></g>
  </g>
  <g class="scan">
    <rect x="52" y="10" width="4" height="80" rx="2" fill="#ffb020"/>
    <rect x="36" y="10" width="20" height="80" fill="#ffb020" opacity=".12"/>
