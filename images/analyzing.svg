<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" fill="none">
  <style>
    .scan { animation: scan 1.8s ease-in-out infinite alternate; }
    .wheel { animation: spin 1s linear infinite; transform-box: fill-box; transform-origin: center; }
    .road { animation: road .6s linear infinite; }
    @keyframes scan { from { transform: translateX(0); } to { transform: translateX(190px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes road { to { transform: translateX(-30px); } }
  </style>
  <g class="road"><path d="M0 100h350" stroke="#2b313a" stroke-width="3" stroke-dasharray="18 12" stroke-linecap="round"/></g>
  <g transform="translate(40 4) scale(.75)">
