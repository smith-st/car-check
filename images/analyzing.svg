  <path d="M50 66L62 52Q66 47 74 46L106 43L106 66Z" fill="#ffb020" fill-opacity=".14" stroke="#ffb020" stroke-opacity=".5" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M114 42L150 41Q160 41 168 46L196 66L114 66Z" fill="#ffb020" fill-opacity=".14" stroke="#ffb020" stroke-opacity=".5" stroke-width="1.5" stroke-linejoin="round"/>
