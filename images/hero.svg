    <path d="M282 88h10" stroke="#ffb020" stroke-width="4" stroke-linecap="round"/>
    <circle cx="78" cy="108" r="18" fill="#0f1114" stroke="#8b95a3" stroke-width="3"/>
    <circle cx="78" cy="108" r="7.5" fill="#ffb020"/>
    <circle cx="242" cy="108" r="18" fill="#0f1114" stroke="#8b95a3" stroke-width="3"/>
    <circle cx="242" cy="108" r="7.5" fill="#ffb020"/>
  </g>

  <!-- лупа над двигуном: всередині «рентген» -->
