    <rect x="62" y="70" width="70" height="8" rx="4" fill="#ffb020"/>
    <circle cx="70" cy="102" r="8" fill="#3ccf8e" fill-opacity=".18"/>
    <path d="M66 102l3 3 5-6" stroke="#3ccf8e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
